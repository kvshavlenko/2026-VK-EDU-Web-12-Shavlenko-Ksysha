{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-secondary pb-2">
        <h1 class="fs-4 fw-bold mb-0 text-white">Log In</h1>
    </div>

    <div class="card bg-dark-gray p-4 shadow-sm">
        <!-- сообщение об ошибке -->
        <div class="alert alert-danger p-2 text-center small" role="alert">
            Sorry, wrong password!
        </div>

        <form>
            <!-- поле логин -->
            <div class="mb-3">
                <label for="login" class="form-label text-white">Login</label>
                <input type="text" class="form-control is-invalid" id="login" placeholder="Enter your login">
                <div class="invalid-feedback">Enter your login here</div>
            </div>
            
            <!-- поле пароль -->
            <div class="mb-4">
                <label for="password" class="form-label text-white">Password</label>
                <input type="password" class="form-control" id="password" placeholder="********">
                <div class="form-text text-light-gray">Минимум 8 символов.</div>
            </div>
            
            <!-- кнопка отправки -->
            <button type="submit" class="btn btn-green px-4">Log in!</button>
            
            <!-- ссылка на регистрацию (ведет на страницу signup) -->
            <div class="mt-3">
                <a href="{% url 'signup' %}" class="link-white small">create new account.</a>
            </div>
        </form>
    </div>
{% endblock %}

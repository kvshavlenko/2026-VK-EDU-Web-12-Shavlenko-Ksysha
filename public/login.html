<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>AskPupkin - Log In</title>
    <link rel="icon" href="static/img/pupkin.png" type="image/png">
    <!-- подключаем бутстрап -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
    <!-- подключаем стили -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-pure-black">

    <!-- шапка сайта -->
    <nav class="navbar navbar-expand-lg bg-dark-gray border-bottom border-secondary">
        <div class="container">
            <!-- логотип -->
            <a class="navbar-brand fs-3 fw-bold text-white" href="index.html">AskPupkin</a>
            
            <!-- поиск и кнопка -->
            <form class="d-flex flex-grow-1 mx-4 search-form" role="search">
                <input class="form-control me-2 search-input" type="search" placeholder="Поиск...">
                <a href="ask.html" class="btn btn-green fw-bold">ASK!</a>
            </form>
            
            <!-- кнопки входа и регистрации -->
            <div class="d-flex align-items-center gap-3">
                <a href="login.html" class="link-white fw-bold">log in</a>
                <a href="signup.html" class="link-white fw-bold">register</a>
            </div>
        </div>
    </nav>

    <!-- контент -->
    <main class="container flex-grow-1 mt-4">
        <div class="row g-4">
            
            <!-- левая колонка с формой -->
            <div class="col-lg-8">
                
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-secondary pb-2">
                    <h1 class="fs-4 fw-bold mb-0 text-white">Log In</h1>
                </div>

                <div class="card bg-dark-gray p-4 shadow-sm">
                    <!-- сообщение об ошибке -->
                    <div class="alert alert-danger p-2 text-center small" role="alert">
                        Sorry, wrong password!
                    </div>

                    <form>
                        <!-- поле логин -->
                        <div class="mb-3">
                            <label for="login" class="form-label text-white">Login</label>
                            <input type="text" class="form-control is-invalid" id="login" placeholder="Enter your login">
                            <div class="invalid-feedback">Enter your login here</div>
                        </div>
                        
                        <!-- поле пароль -->
                        <div class="mb-4">
                            <label for="password" class="form-label text-white">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="********">
                            <div class="form-text text-light-gray">Минимум 8 символов.</div>
                        </div>
                        
                        <!-- кнопка отправки -->
                        <button type="submit" class="btn btn-green px-4">Log in!</button>
                        
                        <!-- ссылка на регистрацию -->
                        <div class="mt-3">
                            <a href="signup.html" class="link-white small">create new account.</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- правая колонка с тегами и юзерами -->
            <div class="col-lg-4">
                
                <!-- популярные теги -->
                <div class="card mb-4 bg-dark-gray shadow-sm">
                    <div class="card-header bg-transparent border-secondary py-3">
                        <h3 class="fs-6 fw-bold text-uppercase text-light-gray mb-0">Popular Tags</h3>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2">
                            <a href="tag.html" class="badge tag-badge p-2 text-decoration-none">python</a>
                            <a href="tag.html" class="badge tag-badge p-2 text-decoration-none">django</a>
                            <a href="tag.html" class="badge tag-badge p-2 text-decoration-none">javascript</a>
                            <a href="tag.html" class="badge tag-badge p-2 text-decoration-none">css</a>
                        </div>
                    </div>
                </div>

                <!-- лучшие участники -->
                <div class="card bg-dark-gray shadow-sm">
                    <div class="card-header bg-transparent border-secondary py-3">
                        <h3 class="fs-6 fw-bold text-uppercase text-light-gray mb-0">Best Members</h3>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled mb-0">
                            <li class="mb-3"><a href="#" class="link-white fw-bold">👤 Dr. Pepper</a></li>
                            <li class="mb-3"><a href="#" class="link-white fw-bold">👤 Mr. Brown</a></li>
                            <li class="mb-3"><a href="#" class="link-white fw-bold">👤 Mrs. Robinson</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- подвал -->
    <footer class="bg-dark-gray border-top border-secondary py-4 mt-auto">
        <div class="container text-center">
            <p class="text-light-gray mb-0">&copy; 2026 AskPupkin. Все права защищены.</p>
        </div>
    </footer>

    <!-- скрипты бутстрапа -->
    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
